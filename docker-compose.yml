version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foss-assemble
    ports:
      - "6001:6001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=foss-assemble-secret
    volumes:
      # Mount the .env file so the container can access the admin password & secrets
      - ./server/.env:/app/server/.env
      # Mount the local database so it persists across container restarts
      - ./server/escape_room.db:/app/server/escape_room.db
      # Mount the certs directory to enable local HTTPS support
      - ./certs:/app/certs
