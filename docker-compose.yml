version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foss-assemble
    ports:
      - "6001:6001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=foss-assemble-secret
      # - ADMIN_PASSWORD=your_secure_password_here
    # Note: If you want to use a .env file, uncomment the lines below instead of mounting it as a volume!
    # env_file:
    #   - ./server/.env
    volumes:
      # Mount the data DIRECTORY instead of the file directly to prevent Docker from creating a directory!
      - ./server/data:/app/server/data
      # Mount the certs directory to enable local HTTPS support (optional if behind Cloudflare)
      - ./certs:/app/certs
